<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lovejiao--登录到lovejiao</title>
    <style>
        /* 页面基础样式 */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 登录卡片容器 */
        .login-card {
            width: 400px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        /* 登录标题 */
        .login-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin: 0 0 8px;
        }

        /* 登录副标题 */
        .login-subtitle {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin: 0 0 30px;
        }

        /* 表单项 */
        .form-group {
            margin-bottom: 20px;
        }

        /* 输入框标签 */
        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }

        /* 输入框样式 */
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
            outline: none;
        }

        /* 输入框聚焦效果 */
        .form-group input:focus {
            border-color: #1B6ACE;
            box-shadow: 0 0 0 3px rgba(27, 106, 206, 0.12);
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1B6ACE;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 150ms ease, transform 150ms ease;
            margin-top: 10px;
        }

        /* 登录按钮悬停效果 */
        .login-btn:hover {
            background: #1559a8;
            transform: translateY(-1px);
        }

        /* 错误提示信息 */
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
            min-height: 18px;
        }

    </style>
</head>
<body>
    <!-- 登录卡片 -->
    <div class="login-card">
        <h1 class="login-title">lovejiao管理平台</h1>
        <p class="login-subtitle">登录以管理Lovejiao</p>

        <!-- 登录表单 -->
        <form id="login-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" autocomplete="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码">
            </div>
            <button type="submit" class="login-btn">登 录</button>
            <div id="error-msg" class="error-msg"></div>
        </form>


    <script>
        // 登录表单提交处理
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        // 默认账号密码（前端校验，实际项目应改为后端验证）
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = 'lovejiao';

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();               // 阻止表单默认提交
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // 校验非空
            if (!username || !password) {
                errorMsg.textContent = '用户名和密码不能为空';
                return;
            }

            // 校验账号密码
            if (username === ADMIN_USER && password === ADMIN_PASS) {
                // 登录成功，记录登录状态后跳转到管理页面
                sessionStorage.setItem('lovejiao_admin_logged_in', 'true');
                window.location.href = 'photo_manage.html';
            } else {
                errorMsg.textContent = '用户名或密码错误';
            }
        });
    </script>
</body>
</html>
