<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页库</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ========== 顶部导航栏 ========== */
        .navbar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 返回按钮 */
        .nav-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            color: #A0A0A0;
            font-size: 18px;
            text-decoration: none;
            transition: color 0.2s;
            user-select: none;
        }

        .nav-back:hover {
            color: #ffffff;
        }

        /* 面包屑导航 */
        .nav-breadcrumb {
            font-size: 14px;
            color: #A0A0A0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-breadcrumb span {
            color: #ffffff;
            font-weight: 600;
        }

        /* 导航右侧按钮组 */
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            font-size: 13px;
            color: #A0A0A0;
            background: transparent;
            border: 1px solid #2D2D2D;
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .nav-btn:hover {
            color: #ffffff;
            border-color: #555555;
        }


        /* ========== 主内容区 ========== */
        .main-content {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* 页面标题区 */
        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .page-desc {
            font-size: 14px;
            color: #A0A0A0;
            line-height: 1.6;
        }

        /* ========== 链接列表 ========== */
        /* 列表表头 */
        .list-header {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #2D2D2D;
        }

        .list-header-name {
            flex: 1;
            font-size: 12px;
            color: #A0A0A0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }


        .links-list {
            list-style: none;
        }

        /* 单行链接 */
        .link-row {
            display: flex;
            align-items: center;
            height: 56px;
            padding: 0 16px;
            background: #121212;
            border-bottom: 1px solid #2D2D2D;
            cursor: default;
            transition: background 0.15s, transform 0.18s ease;
        }

        .link-row:hover {
            background: #1A1A1A;
        }

        /* 圆形图标 */
        .link-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            flex-shrink: 0;
            margin-right: 12px;
            user-select: none;
            line-height: 1;
        }

        .link-name-wrapper {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .link-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .link-name:hover {
            text-decoration: underline;
        }

        /* 删除按钮（管理模式下显示） */
        .link-delete {
            margin-left: 12px;
            padding: 4px 10px;
            font-size: 12px;
            color: #E57373;
            background: transparent;
            border: 1px solid #3D2020;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .link-delete:hover {
            color: #EF9A9A;
            border-color: #5D3030;
        }

        /* ========== 文件夹行 ========== */
        /* 文件夹行尺寸与链接行完全一致 */
        .folder-row {
            display: flex;
            align-items: center;
            height: 56px;
            padding: 0 16px;
            background: #121212;
            border-bottom: 1px solid #2D2D2D;
            cursor: default;
            transition: background 0.15s, transform 0.18s ease;
        }

        .folder-row:hover {
            background: #1A1A1A;
        }

        /* 文件夹名称（不可点击，仅展示） */
        .folder-name-wrapper {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .folder-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 三个点操作入口（文件夹 + 链接共用） */
        .folder-dots,
        .link-dots {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            flex-shrink: 0;
            color: #A0A0A0;
            font-size: 18px;
            letter-spacing: 2px;
            line-height: 1;
            user-select: none;
            transition: all 0.2s;
            touch-action: none;
        }

        /* hover 仅视觉反馈（提亮），不触发弹窗 */
        .folder-dots:hover,
        .link-dots:hover {
            color: #ffffff;
            background: #2D2D2D;
        }

        /* 长按中（待触发拖动）视觉反馈 */
        .folder-row.drag-ready,
        .link-row.drag-ready {
            background: #1E1E1E;
        }

        /* 拖动中行：拖起时轻微抬高、浮起阴影 */
        .folder-row.dragging,
        .link-row.dragging {
            opacity: 0.6;
            background: #1F1F1F;
            position: relative;
            z-index: 100;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        }

        /* 链接行三个点与名称靠右留出间距 */
        .link-row .link-dots {
            margin-left: 12px;
        }

        /* ========== 添加链接区 ========== */
        .add-link-area {
            margin-top: 32px;
            padding: 24px;
            background: #121212;
            border-radius: 12px;
            border: 1px solid #2D2D2D;
        }

        .add-link-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .add-link-inputs {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        /* 输入组 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 180px;
        }

        .input-group label {
            font-size: 12px;
            color: #A0A0A0;
        }

        .input-group input {
            height: 40px;
            border: 1px solid #2D2D2D;
            border-radius: 8px;
            background: #0A0A0A;
            color: #ffffff;
            font-size: 14px;
            padding: 0 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #555555;
        }

        .input-group input::placeholder {
            color: #555555;
        }

        /* 添加按钮 */
        .add-link-btn {
            height: 40px;
            padding: 0 24px;
            border: none;
            border-radius: 8px;
            background: #ffffff;
            color: #000000;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .add-link-btn:hover {
            opacity: 0.85;
        }

        /* ========== 删除确认弹窗 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            width: 400px;
            height: 200px;
            background: #121212;
            border: 1px solid #2D2D2D;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
            margin: 0;
        }

        .modal-message {
            font-size: 14px;
            color: #A0A0A0;
            line-height: 1.6;
            flex: 1;
            display: flex;
            align-items: center;
            white-space: pre-line;
        }

        /* 按钮容器：确认在右，取消在左 */
        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-btn {
            width: 70px;
            height: 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-btn:hover {
            opacity: 0.85;
        }

        .modal-btn.cancel {
            background: transparent;
            border: 1px solid #3D2020;
            color: #E57373;
        }

        .modal-btn.confirm {
            background: #FFFFFF;
            color: #000000;
            padding: 0 24px;
        }

        /* 左下角“不再提示” */
        .modal-remind {
            font-size: 12px;
            color: #777777;
            cursor: pointer;
            user-select: none;
            align-self: flex-start;
            margin-top: auto;
            padding: 2px 0;
            transition: color 0.2s;
            /* top: 5px; */
        }

        .modal-remind::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 1.5px solid #555555;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: -2px;
            text-align: center;
            line-height: 14px;
            font-size: 10px;
            color: #ffffff;
            transition: all 0.2s;
        }

        .modal-remind:hover {
            color: #A0A0A0;
        }

        .modal-remind:hover::before {
            border-color: #888888;
        }

        /* 选中状态：白框 + 绿色对号 + 文字变亮 */
        .modal-remind[data-checked="1"] {
            color: #ffffff;
        }

        .modal-remind[data-checked="1"]::before {
            content: '✓';
            background: #4CAF50;
            border-color: #4CAF50;
        }

        /* ========== 悬浮操作菜单（三个点点击） ========== */
        .action-menu {
            position: fixed;
            background: #1A1A1A;
            border: 1px solid #2D2D2D;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: none;
            overflow: hidden;
            min-width: 120px;
            padding: 4px 0;
        }

        .action-menu.active {
            display: block;
        }

        .action-menu-item {
            display: block;
            width: 100%;
            padding: 10px 16px;
            font-size: 13px;
            color: #A0A0A0;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            font-family: inherit;
        }

        .action-menu-item:hover {
            color: #ffffff;
            background: #2D2D2D;
        }

        .action-menu-item.danger {
            color: #E57373;
        }

        .action-menu-item.danger:hover {
            color: #EF9A9A;
            background: #3D2020;
        }

        /* ========== 新建/重命名文件夹悬浮窗 ========== */
        .folder-modal-input-group {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .folder-modal-input-group label {
            font-size: 12px;
            color: #A0A0A0;
        }

        .folder-modal-input-group input {
            height: 40px;
            border: 1px solid #2D2D2D;
            border-radius: 8px;
            background: #0A0A0A;
            color: #ffffff;
            font-size: 14px;
            padding: 0 12px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .folder-modal-input-group input:focus {
            border-color: #555555;
        }

        .folder-modal-input-group input::placeholder {
            color: #555555;
        }
    </style>
</head>

<body>
    <!-- ========== 顶部导航栏 ========== -->
    <nav class="navbar">
        <div class="navbar-left">
            <a class="nav-back" id="back-btn" href="index.html" title="返回主页">&larr;</a>
            <div class="nav-breadcrumb">
                <a class="nav-back" id="breadcrumb-home" href="index.html"
                    style="width: auto; height: auto; font-size: 14px; color: #A0A0A0;">主页</a>
                <span>/</span>
                <span>网页库</span>
            </div>
        </div>
        <div class="navbar-right">
            <button class="nav-btn" id="btn-new-folder">新建文件夹</button>
            <button class="nav-btn" id="btn-manage">管理链接</button>
        </div>
    </nav>

    <!-- ========== 主内容区 ========== -->
    <main class="main-content">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1 class="page-title">网页库</h1>
            <p class="page-desc">保存和管理常用网页链接，支持用文件夹分类整理</p>
        </div>

        <!-- 添加新链接区（移至列表上方，便于先添加再浏览） -->
        <div class="add-link-area">
            <h2 class="add-link-title">添加新链接</h2>
            <div class="add-link-inputs">
                <div class="input-group">
                    <label for="new-link-url">网址 URL</label>
                    <input type="text" id="new-link-url" placeholder="输入网站地址">
                </div>
                <div class="input-group">
                    <label for="new-link-name">名称</label>
                    <input type="text" id="new-link-name" placeholder="输入网站名称">
                </div>
                <button class="add-link-btn" id="add-link-btn">添加链接</button>
            </div>
        </div>

        <!-- 列表表头 -->
        <div class="list-header">
            <span class="list-header-name">链接名称</span>

        </div>

        <!-- 链接列表（由 JS 动态渲染） -->
        <ul class="links-list" id="links-list"></ul>

        <!-- ========== 删除确认弹窗 ========== -->
        <div class="modal-overlay" id="removeModal">
            <div class="modal-box">
                <h3 class="modal-title">删除链接</h3>
                <p class="modal-message" id="removeMsg"></p>
                <div class="modal-actions">
                    <button class="modal-btn cancel" id="removeCancel">取消</button>
                    <button class="modal-btn confirm" id="removeConfirm">确认</button>
                </div>
                <span class="modal-remind" id="removeRemind">不再提示</span>
            </div>
        </div>

        <!-- ========== 新建/重命名文件夹悬浮窗 ========== -->
        <div class="modal-overlay" id="folderModal">
            <div class="modal-box">
                <h3 class="modal-title" id="folderModalTitle">新建文件夹</h3>
                <div class="folder-modal-input-group">
                    <input type="text" id="folder-name-input" placeholder="输入文件夹名称" maxlength="30">
                </div>
                <div class="modal-actions">
                    <button class="modal-btn cancel" id="folderModalCancel">取消</button>
                    <button class="modal-btn confirm" id="folderModalConfirm">确认</button>
                </div>
            </div>
        </div>

        <!-- ========== 悬浮操作菜单（三个点点击） ========== -->
        <div class="action-menu" id="actionMenu">
            <button class="action-menu-item" id="actionRename">重命名</button>
            <button class="action-menu-item danger" id="actionDelete">删除</button>
        </div>

        <!-- ========== 重命名链接弹窗 ========== -->
        <div class="modal-overlay" id="renameLinkModal">
            <div class="modal-box">
                <h3 class="modal-title">重命名链接</h3>
                <div class="folder-modal-input-group">
                    <input type="text" id="rename-link-input" placeholder="输入新名称" maxlength="30">
                </div>
                <div class="modal-actions">
                    <button class="modal-btn cancel" id="renameLinkCancel">取消</button>
                    <button class="modal-btn confirm" id="renameLinkConfirm">确认</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function () {
            /* ========== 存储键与常量配置 ========== */
            var UK = 'customLinks_v1';          // localStorage 自定义链接键
            var UCK = 'customLinks_backup_v1';  // cookie 自定义链接备份键
            var FK = 'folders_v1';              // localStorage 文件夹键
            var FCK = 'folders_backup_v1';      // cookie 文件夹备份键
            var LOK = 'listOrder_v1';           // localStorage 自定义排序键
            var LOBCK = 'listOrder_backup_v1';  // cookie 自定义排序备份键
            var BD = 3650;                      // cookie 过期天数（约 10 年）

            /* ========== 图标颜色池 ========== */
            var IC = [
                '#FF6F00', '#311B92', '#00C853', '#2196F3',
                '#FF9900', '#4CAF50', '#3F51B5', '#E91E63',
                '#009688', '#FF5722', '#795548', '#607D8B'
            ];

            /* ========== 预置链接列表 ========== */
            var PRE = [
                { n: '千问', u: 'https://www.qianwen.com/chat' },
                { n: 'GitHub', u: 'https://github.com/' },
                { n: '光鸭云盘', u: 'https://www.guangyapan.com/#/home/all' },
                { n: '菜鸟工具', u: 'https://www.jyshare.com/' },
                { n: '中国教育考试网', u: 'https://ncre.neea.edu.cn/' },
                { n: '中国计算机技术职业资格网（软考）', u: 'https://www.ruankao.org.cn/' },
                { n: 'W3School', u: 'https://www.w3school.com.cn/' },
                { n: '光鸭资源设', u: 'https://www.guangya.cc/' },
                { n: '校园知问', u: 'https://xiaobaocampus.com/' },
                { n: '赛博丐帮', u: 'https://poorgpt.com/' },
                { n: '觅知网', u: 'https://www.51miz.com/?utm_term=5495868&utm_source=x360&guanggao&qhclickid=9a41eeb8f87985b7' },
                { n: '调色板生成器和色轮工具', u: 'https://color.adobe.com/cn/create/color-wheel?tab=primary-color' },
                { n: 'aboutppt', u: 'https://www.aboutppt.com/#term-2-3' },
                { n: '即时移除背景', u: 'https://remove-bg.io/zh-CN/' },
                { n: '佐糖AI', u: 'https://picwish.cn/remove-background?apptype=aps-bing-zh-webpin&msclkid=d8d5f74bd2e1129556ed9d1b29d964e7' },
                { n: '阿里巴巴矢量图标库', u: 'https://www.iconfont.cn/' },
                { n: '优设字体', u: 'https://hao.uisdc.com/font/' },
                { n: '猫啃网', u: 'https://www.maoken.com/' },
                { n: '豆包', u: 'https://www.doubao.com/chat/' },
                { n: '抖音', u: 'https://www.douyin.com/?recommend=1' },
                { n: 'Outlook', u: 'https://outlook.live.com/calendar/view/month?culture=zh-cn&country=cn' },
                { n: 'AI去水印', u: 'https://magiceraser.org/zh/object-remover/' },
                { n: '优智云家', u: 'https://go.kiwik.cn/app/wob/devices/4A3843D34040' },
                { n: '@@@@', u: '#' }  // 特殊占位项（会被隐藏）
            ];

            /* ========== 初始化状态 ========== */
            var list = document.getElementById('links-list');
            if (!list) return;

            var all = PRE.slice();   // 全部链接（预置 + 自定义）

            /* ========== 管理模式状态 ========== */
            var manageMode = false;        // 是否处于管理模式
            var hiddenPresets = [];        // 会话内已隐藏的预置链接集合（不持久化）

            /* ========== 文件夹状态 ========== */
            var folders = loadFolders();   // 文件夹内存数组（数组顺序即展示顺序）

            /* ========== Cookie 读写工具函数 ========== */
            function getC(n) {
                var m = document.cookie.match(
                    new RegExp('(?:^|; )' + n.replace(/([.$?*|{}()\[\]\\\/+^])/g, '\\$1') + '=([^;]*)')
                );
                return m ? decodeURIComponent(m[1]) : null;
            }

            function setC(n, v, d) {
                try {
                    document.cookie = n + '=' + encodeURIComponent(v) +
                        ';expires=' + new Date(Date.now() + d * 86400000).toUTCString() +
                        ';path=/';
                } catch (e) { }
            }

            /* ========== 持久化保存 ========== */

            function saveUL(arr) {
                try { localStorage.setItem(UK, JSON.stringify(arr)); } catch (e) { }
                try { setC(UCK, JSON.stringify(arr), BD); } catch (e) { }
            }

            function loadUL() {
                // 优先从 localStorage 读取
                try {
                    var r = localStorage.getItem(UK);
                    if (r) {
                        var p = JSON.parse(r);
                        return Array.isArray(p) ? p : [];
                    }
                } catch (e) { }
                // 兜底从 cookie 读取
                try {
                    var c = getC(UCK);
                    if (c) {
                        var p = JSON.parse(c);
                        return Array.isArray(p) ? p : [];
                    }
                } catch (e) { }
                return [];
            }

            /* ========== 文件夹持久化 ========== */
            function loadFolders() {
                var arr = [];
                try {
                    var r = localStorage.getItem(FK);
                    if (r) {
                        var p = JSON.parse(r);
                        if (Array.isArray(p)) arr = p;
                    }
                } catch (e) { }
                if (arr.length === 0) {
                    try {
                        var c = getC(FCK);
                        if (c) {
                            var p = JSON.parse(c);
                            if (Array.isArray(p)) arr = p;
                        }
                    } catch (e) { }
                }
                // 规范化：兼容旧版存的纯名字符串数组
                return arr.map(function (x) {
                    if (typeof x === 'string') return { n: x };
                    return { n: (x && x.n) || '未命名文件夹' };
                });
            }

            function saveFolders(arr) {
                try { localStorage.setItem(FK, JSON.stringify(arr)); } catch (e) { }
                try { setC(FCK, JSON.stringify(arr), BD); } catch (e) { }
            }

            /* ========== 自定义排序持久化 ========== */
            // 保存整体列表顺序：[{t:'folder', n}, {t:'link', n, u}, ...]
            function saveListOrder(arr) {
                try { localStorage.setItem(LOK, JSON.stringify(arr)); } catch (e) { }
                try { setC(LOBCK, JSON.stringify(arr), BD); } catch (e) { }
            }

            function loadListOrder() {
                try {
                    var r = localStorage.getItem(LOK);
                    if (r) {
                        var p = JSON.parse(r);
                        return Array.isArray(p) ? p : null;
                    }
                } catch (e) { }
                try {
                    var c = getC(LOBCK);
                    if (c) {
                        var p = JSON.parse(c);
                        return Array.isArray(p) ? p : null;
                    }
                } catch (e) { }
                return null;
            }

            /* 清理旧版本残留的点击次数数据 */
            function cleanLegacyCounts() {
                try { localStorage.removeItem('linkClicks_v1'); } catch (e) { }
                try { localStorage.removeItem('linkClicks_backup_v1'); } catch (e) { }
                try { setC('linkClicks_backup_v1', '', -1); } catch (e) { }
            }

            /* ========== 图标与名称工具函数 ========== */
            function iconColor(n) {
                var fc = (n || '').trim().charAt(0) || '?';
                return IC[fc.charCodeAt(0) % IC.length];
            }

            function firstChar(n) {
                var c = (n || '').trim();
                return c ? c.charAt(0).toUpperCase() : '?';
            }

            // 判断是否为特殊占位项
            function isSp(n) {
                return n.indexOf('@@@@') !== -1;
            }

            // 规范化 URL（补全协议）
            function normUrl(u) {
                u = (u || '').trim();
                if (!u) return '';
                if (/^https?:\/\//i.test(u)) return u;
                return 'https://' + u;
            }

            /* ========== 创建单行链接 DOM ========== */
            function mkRow(item, idx) {
                var li = document.createElement('li');
                li.className = 'link-row';
                if (isSp(item.n)) li.style.display = 'none';

                // 图标
                var ic = document.createElement('span');
                ic.className = 'link-icon';
                ic.style.background = iconColor(item.n);
                ic.textContent = firstChar(item.n);

                // 名称容器
                var nw = document.createElement('div');
                nw.className = 'link-name-wrapper';
                var ns = document.createElement('span');
                ns.className = 'link-name';
                ns.textContent = item.n;


                // 删除按钮（管理模式下显示，特殊占位项不渲染）
                var delBtn = null;
                if (!isSp(item.n)) {
                    delBtn = document.createElement('button');
                    delBtn.className = 'link-delete';
                    delBtn.textContent = '删除';
                    delBtn.style.display = manageMode ? 'inline-block' : 'none';
                }

                // 组装结构
                li.appendChild(ic);
                li.appendChild(nw);
                nw.appendChild(ns);

                if (delBtn) li.appendChild(delBtn);

                // 三个点手柄（管理模式内长按拖动可自定义排序）
                var dots = document.createElement('span');
                dots.className = 'link-dots';
                dots.textContent = '\u2022\u2022\u2022';
                li.appendChild(dots);
                bindGrip(li, dots, false);

                // 缓存数据到 DOM 节点
                li._d = item;
                li._i = idx;

                // 点击名称：打开链接
                ns.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (item.u && item.u !== '#') window.open(item.u, '_blank');
                });

                // 点击删除按钮：阻止冒泡，弹出确认
                if (delBtn) {
                    delBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        var isPreset = PRE.some(function (p) {
                            return p.n === item.n && p.u === item.u;
                        });
                        confirmRemove(item, isPreset);
                    });
                }

                return li;
            }

            /* ========== 渲染列表（按自定义排序，默认文件夹行在前、链接行按名称） ========== */
            function render() {
                // 过滤会话内已隐藏的预置链接（按 u+n 匹配）
                var items = all.filter(function (item) {
                    if (hiddenPresets.length === 0) return true;
                    return !hiddenPresets.some(function (h) {
                        return h.u === item.u && h.n === item.n;
                    });
                });
                // 分离特殊项与普通项
                var sp = [], nm = [];
                items.forEach(function (item) {
                    if (isSp(item.n)) {
                        sp.push(item);
                    } else {
                        nm.push(item);
                    }
                });
                // 构建统一渲染序列 rows：[{t:'f', f}] 文件夹行 / [{t:'l', item}] 链接行
                // 不再按名称排序：顺序完全由用户自由拖动决定；
                // 从未保存过顺序时，按加载顺序渲染（预置在前、自定义链接追加在后）
                var rows = [];
                var saved = loadListOrder();
                if (saved && saved.length) {
                    var usedF = {}, usedL = {};
                    saved.forEach(function (ent) {
                        if (ent.t === 'folder' && !usedF[ent.n]) {
                            // 按名称匹配文件夹
                            for (var i = 0; i < folders.length; i++) {
                                if (folders[i].n === ent.n) {
                                    rows.push({ t: 'f', f: folders[i] });
                                    usedF[ent.n] = 1;
                                    break;
                                }
                            }
                        } else if (ent.t === 'link') {
                            var key = ent.n + '|' + ent.u;
                            if (!usedL[key]) {
                                for (var j = 0; j < nm.length; j++) {
                                    if (nm[j].n === ent.n && nm[j].u === ent.u) {
                                        rows.push({ t: 'l', item: nm[j] });
                                        usedL[key] = 1;
                                        break;
                                    }
                                }
                            }
                        }
                    });
                    // 追加保存顺序之外的新增文件夹 / 新增链接
                    folders.forEach(function (f) {
                        if (!usedF[f.n]) rows.push({ t: 'f', f: f });
                    });
                    nm.forEach(function (item) {
                        if (!usedL[item.n + '|' + item.u]) rows.push({ t: 'l', item: item });
                    });
                } else {
                    // 首次：文件夹在前（按其内部顺序），链接按加载顺序展示
                    folders.forEach(function (f) {
                        rows.push({ t: 'f', f: f });
                    });
                    nm.forEach(function (item) {
                        rows.push({ t: 'l', item: item });
                    });
                }
                // 特殊占位项始终追加到末尾（会被隐藏）
                sp.forEach(function (item) {
                    rows.push({ t: 'l', item: item });
                });

                // 重绘列表
                list.innerHTML = '';
                rows.forEach(function (r) {
                    if (r.t === 'f') list.appendChild(mkFolderRow(r.f));
                    else list.appendChild(mkRow(r.item));
                });
            }

            /* ========== 添加新链接 ========== */
            function addNewLink() {
                var ui = document.getElementById('new-link-url'),
                    ni = document.getElementById('new-link-name');
                if (!ui || !ni) return;

                var raw = ui.value.trim(),
                    name = ni.value.trim();

                // 输入校验
                if (!raw) { alert('请输入URL'); return; }
                if (!name) { alert('请输入名称'); return; }

                // 重名校验
                var exist = all.filter(function (l) { return !isSp(l.n); });
                if (exist.some(function (l) { return l.n.toLowerCase() === name.toLowerCase(); })) {
                    alert('名称已被添加，换一个名称再试试吧！');
                    return;
                }

                // 保存并刷新
                var url = normUrl(raw);
                var newItem = { n: name, u: url };
                all.push(newItem);

                var saved = loadUL();
                saved.push({ url: url, name: name });
                saveUL(saved);

                render();
                ui.value = '';
                ni.value = '';
            }


            /* ========== 切换管理模式 ========== */
            function toggleManageMode() {
                manageMode = !manageMode;
                var manageBtn = document.getElementById('btn-manage');
                if (manageBtn) manageBtn.textContent = manageMode ? '退出管理' : '管理链接';
                render();
            }

            /* ========== 删除确认（自定义弹窗） ========== */
            var removeState = null;       // 当前待删除项 { item, isPreset }
            var removeTipOff = false;  // 是否已勾选“不再提示”

            function confirmRemove(item, isPreset) {
                // 已开启“不再提示”：跳过弹窗直接删除
                try {
                    if (localStorage.getItem('linkRemoveTipOff') === '1') {
                        removeLink(item, isPreset);
                        return;
                    }
                } catch (e) { }

                // 记录待删除项并填充弹窗内容
                removeState = { item: item, isPreset: isPreset };
                var msg = isPreset
                    ? '确认删除该预置链接？\n（将本会话隐藏，刷新后恢复）'
                    : '确认删除该自定义链接？\n（将永久删除）';
                document.getElementById('removeMsg').textContent = msg;

                // 初始化“不再提示”的选中状态，和 localStorage 保持一致
                var remindEl = document.getElementById('removeRemind');
                if (remindEl) {
                    try {
                        var tipOff = localStorage.getItem('linkRemoveTipOff') === '1';
                        remindEl.setAttribute('data-checked', tipOff ? '1' : '0');
                    } catch (e) {
                        remindEl.setAttribute('data-checked', '0');
                    }
                }

                document.getElementById('removeModal').classList.add('active');
            }

            /* ========== 执行删除 ========== */
            function removeLink(item, isPreset) {
                if (isPreset) {
                    // 预置链接：加入会话内隐藏集合（不写存储）
                    hiddenPresets.push({ n: item.n, u: item.u });
                } else {
                    // 自定义链接：从存储中永久移除
                    var saved = loadUL();
                    var remained = saved.filter(function (s) {
                        return !(s.url === item.u && s.name === item.n);
                    });
                    saveUL(remained);

                }
                // 从内存列表移除
                all = all.filter(function (a) {
                    return !(a.u === item.u && a.n === item.n);
                });
                render();
            }

            /* ========== 弹窗事件绑定 ========== */
            function bindRemoveModal() {
                var modal = document.getElementById('removeModal');
                var cancelBtn = document.getElementById('removeCancel');
                var confirmBtn = document.getElementById('removeConfirm');
                var remindEl = document.getElementById('removeRemind');

                if (!modal || !cancelBtn || !confirmBtn) return;

                cancelBtn.addEventListener('click', function () {
                    modal.classList.remove('active');
                    removeState = null;
                });

                confirmBtn.addEventListener('click', function () {
                    if (!removeState) return;
                    modal.classList.remove('active');
                    if (removeState.isFolder) {
                        folders.splice(removeState.folderIdx, 1);
                        saveFolders(folders);
                        render();
                    } else {
                        removeLink(removeState.item, removeState.isPreset);
                    }
                    removeState = null;
                });

                /* 左下角“不再提示” */
                if (remindEl) {
                    remindEl.addEventListener('click', function () {
                        var flag = remindEl.getAttribute('data-checked') === '1';
                        if (flag) {
                            remindEl.setAttribute('data-checked', '0');
                            try { localStorage.removeItem('linkRemoveTipOff'); } catch (e) { }
                        } else {
                            remindEl.setAttribute('data-checked', '1');
                            try { localStorage.setItem('linkRemoveTipOff', '1'); } catch (e) { }
                        }
                    });
                }
            }

            // ========== 创建文件夹行 DOM ==========
            function mkFolderRow(folder, index) {
                var li = document.createElement('li');
                li.className = 'folder-row';
                li._d = folder;

                // 文件夹名称（不可点击，仅展示）
                var fw = document.createElement('div');
                fw.className = 'folder-name-wrapper';
                var fn = document.createElement('span');
                fn.className = 'folder-name';
                fn.textContent = folder.n || '未命名文件夹';
                fw.appendChild(fn);

                // 三个点操作入口（管理模式内长按拖动可自定义排序）
                var dots = document.createElement('span');
                dots.className = 'folder-dots';
                dots.textContent = '\u2022\u2022\u2022';
                bindGrip(li, dots, true);

                li.appendChild(fw);
                li.appendChild(dots);
                return li;
            }

            /* ========== 新建 / 重命名 文件夹弹窗绑定 ========== */
            var editingFolderId = -1;   // -1 表示新建，否则为当前编辑的文件夹下标

            function bindFolderModal() {
                var modal = document.getElementById('folderModal');
                var cancelBtn = document.getElementById('folderModalCancel');
                var confirmBtn = document.getElementById('folderModalConfirm');
                var input = document.getElementById('folder-name-input');
                if (!modal || !input || !cancelBtn || !confirmBtn) return;

                function closeModal() {
                    modal.classList.remove('active');
                    input.value = '';
                }

                cancelBtn.addEventListener('click', closeModal);

                confirmBtn.addEventListener('click', function () {
                    var name = input.value.trim();
                    if (!name) { alert('请输入文件夹名称'); return; }
                    if (editingFolderId >= 0) {
                        // 重命名
                        folders[editingFolderId].n = name;
                    } else {
                        // 新建（重名校验）
                        var dup = folders.some(function (f) { return f.n === name; });
                        if (dup) { alert('已存在同名文件夹，换一个名称再试试吧！'); return; }
                        folders.push({ n: name });
                    }
                    saveFolders(folders);
                    render();
                    closeModal();
                });
            }

            /* 打开新建文件夹弹窗 */
            function openNewFolder() {
                editingFolderId = -1;
                document.getElementById('folderModalTitle').textContent = '新建文件夹';
                document.getElementById('folder-name-input').value = '';
                document.getElementById('folderModal').classList.add('active');
            }

            /* 打开重命名文件夹弹窗 */
            function openRenameFolder(idx) {
                editingFolderId = idx;
                document.getElementById('folderModalTitle').textContent = '重命名文件夹';
                document.getElementById('folder-name-input').value = folders[idx].n;
                document.getElementById('folderModal').classList.add('active');
            }

            /* ========== 悬浮操作菜单（三个点点击） ========== */
            var actionMenu = document.getElementById('actionMenu');
            var actionMenuState = null;   // { isFolder, item?, folderIdx? }

            /* 打开悬浮操作菜单 */
            function openActionMenu(row, isFolder) {
                var rect = row.getBoundingClientRect();
                actionMenu.style.left = (rect.right - 130) + 'px';
                actionMenu.style.top = (rect.top + 4) + 'px';
                if (isFolder) {
                    var idx = folderIndexByRef(row._d);
                    actionMenuState = { isFolder: true, folderIdx: idx };
                } else {
                    actionMenuState = { isFolder: false, item: row._d };
                }
                actionMenu.classList.add('active');
            }

            function closeActionMenu() {
                actionMenu.classList.remove('active');
                actionMenuState = null;
            }

            function actionMenuRename() {
                if (!actionMenuState) return;
                var s = actionMenuState;
                closeActionMenu();
                if (s.isFolder) {
                    if (s.folderIdx >= 0) openRenameFolder(s.folderIdx);
                } else {
                    openRenameLink(s.item);
                }
            }

            function actionMenuDelete() {
                if (!actionMenuState) return;
                var s = actionMenuState;
                closeActionMenu();
                if (s.isFolder) {
                    confirmRemoveFolder(s.folderIdx);
                } else {
                    var isPreset = PRE.some(function (p) {
                        return p.n === s.item.n && p.u === s.item.u;
                    });
                    confirmRemove(s.item, isPreset);
                }
            }

            /* ========== 链接重命名 ========== */
            var renameLinkState = null;

            function openRenameLink(item) {
                renameLinkState = { item: item };
                var input = document.getElementById('rename-link-input');
                input.value = item.n;
                document.getElementById('renameLinkModal').classList.add('active');
                setTimeout(function () { input.focus(); input.select(); }, 50);
            }

            function bindRenameLinkModal() {
                var modal = document.getElementById('renameLinkModal');
                var input = document.getElementById('rename-link-input');
                var cancelBtn = document.getElementById('renameLinkCancel');
                var confirmBtn = document.getElementById('renameLinkConfirm');
                if (!modal || !input || !cancelBtn || !confirmBtn) return;

                function closeModal() {
                    modal.classList.remove('active');
                    input.value = '';
                    renameLinkState = null;
                }
                cancelBtn.addEventListener('click', closeModal);
                confirmBtn.addEventListener('click', function () {
                    if (!renameLinkState) return;
                    var newName = input.value.trim();
                    if (!newName) { alert('请输入名称'); return; }
                    var item = renameLinkState.item;
                    if (newName === item.n) { closeModal(); return; }
                    var dup = all.some(function (l) {
                        return !isSp(l.n) && l !== item &&
                            l.n.toLowerCase() === newName.toLowerCase();
                    });
                    if (dup) { alert('名称已被添加，换一个名称再试试吧！'); return; }

                    var oldName = item.n;
                    var order = loadListOrder();
                    if (order) {
                        order.forEach(function (e) {
                            if (e.t === 'link' && e.n === oldName && e.u === item.u) e.n = newName;
                        });
                        saveListOrder(order);
                    }
                    var isPreset = PRE.some(function (p) {
                        return p.n === oldName && p.u === item.u;
                    });
                    if (!isPreset) {
                        var saved = loadUL();
                        saved.forEach(function (s) {
                            if (s.url === item.u && s.name === oldName) s.name = newName;
                        });
                        saveUL(saved);
                    }
                    item.n = newName;
                    render();
                    closeModal();
                });
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') confirmBtn.click();
                });
            }

            /* ========== 文件夹删除确认 ========== */
            function confirmRemoveFolder(idx) {
                removeState = { isFolder: true, folderIdx: idx };
                document.getElementById('removeMsg').textContent =
                    '确认删除文件夹"' + folders[idx].n + '"？\n（其中的链接不会被删除）';
                var remindEl = document.getElementById('removeRemind');
                if (remindEl) {
                    try {
                        remindEl.setAttribute('data-checked',
                            localStorage.getItem('linkRemoveTipOff') === '1' ? '1' : '0');
                    } catch (e) {
                        remindEl.setAttribute('data-checked', '0');
                    }
                }
                document.getElementById('removeModal').classList.add('active');
            }

            /* ========== 长按拖动自定义排序（让位动画） ========== */
            var dragEl = null;         // 当前被长按的行
            var dragY = 0;             // 按下时的 Y 坐标
            var dragLong = false;      // 是否已满足长按 / 移动阈值
            var dragActive = false;    // 是否正在拖动中
            var dragTimer = null;      // 长按定时器
            var dragFrom = 0;          // 被拖行在可见行中的原始下标
            var dragTo = 0;            // 被拖行当前目标下标（拖拽终点位置）

            // 行类型判断：是否为文件夹行
            function isFolderRow(li) {
                return li.className && li.className.indexOf('folder-row') !== -1;
            }

            // 通过文件夹对象引用找其在 folders 数组中的下标
            function folderIndexByRef(f) {
                for (var i = 0; i < folders.length; i++) {
                    if (folders[i] === f) return i;
                }
                return -1;
            }

            // 获取可见行集合（跳过 display:none 的隐藏占位项）
            function visibleRows() {
                var vis = [];
                for (var i = 0; i < list.children.length; i++) {
                    var li = list.children[i];
                    if (li.style && li.style.display === 'none') continue;
                    vis.push(li);
                }
                return vis;
            }

            /* 清空所有行的位移（释放 transform） */
            function clearRowShifts() {
                for (var i = 0; i < list.children.length; i++) {
                    list.children[i].style.transform = '';
                }
            }

            /* 绑定三个点手柄：管理模式内长按拖动排序；否则点击 = 打开文件夹菜单 */
            function bindGrip(row, grip, isFolder) {
                grip.addEventListener('pointerdown', function (e) {
                    e.preventDefault();
                    if (!manageMode) return;  // 非管理模式：跳过拖动逻辑，由 pointerup 处理点击
                    if (row !== dragEl) resetDragState();
                    dragEl = row;
                    dragY = e.clientY;
                    dragLong = false;
                    dragActive = false;
                    row.classList.add('drag-ready');
                    clearTimeout(dragTimer);
                    dragTimer = setTimeout(function () {
                        // 按下满 300ms 视为长按，之后移动即进入拖动
                        dragLong = true;
                    }, 300);
                });

                grip.addEventListener('pointermove', function (e) {
                    if (!manageMode) return;
                    if (row !== dragEl) return;
                    var dy = e.clientY - dragY;
                    if (!dragLong) {
                        // 未到长按时间：移动超过阈值也直接进入拖动
                        if (Math.abs(dy) > 6) dragLong = true;
                        else return;
                    }
                    if (!dragActive) {
                        // 开始拖动：记录起始位置，被拖行跟随指针（轻微抬升交给 transform 偏移），
                        dragActive = true;
                        row.classList.remove('drag-ready');
                        row.classList.add('dragging');
                        row.style.transition = 'transform 0.05s linear, background 0.15s';
                        var vis0 = visibleRows();
                        dragFrom = -1;
                        for (var i = 0; i < vis0.length; i++) {
                            if (vis0[i] === row) { dragFrom = i; break; }
                        }
                        dragTo = dragFrom;
                    }
                    layoutDrag(e.clientY);
                });

                grip.addEventListener('pointerup', function (e) {
                    if (manageMode && row !== dragEl) return;
                    var wasActive = dragActive;
                    clearTimeout(dragTimer);
                    dragEl = null;
                    row.classList.remove('drag-ready');
                    row.classList.remove('dragging');
                    row.style.transition = '';
                    if (wasActive) {
                        // 拖动结束：落定到目标位置并保存
                        commitDrag(row);
                    } else {
                        // 未拖动：视为点击，打开操作菜单（不论文件夹还是链接、不论管理模式）
                        openActionMenu(row, isFolder);
                    }
                    dragActive = false;
                });

                grip.addEventListener('pointercancel', function () {
                    if (row !== dragEl) return;
                    clearTimeout(dragTimer);
                    dragEl = null;
                    row.classList.remove('drag-ready');
                    row.classList.remove('dragging');
                    row.style.transition = '';
                    clearRowShifts();
                    dragActive = false;
                });
            }

            function resetDragState() {
                clearTimeout(dragTimer);
                dragEl = null;
                dragLong = false;
                dragActive = false;
                clearRowShifts();
            }

            /* 拖动中：其他行自动让位（transform 平移出空位），被拖行跟随并轻微抬高 */
            function layoutDrag(y) {
                var vis = visibleRows();
                if (!vis.length) return;
                var h = vis[0].getBoundingClientRect().height || 56;
                var from = -1;
                for (var i = 0; i < vis.length; i++) {
                    if (vis[i] === dragEl) { from = i; break; }
                }
                if (from === -1) return;

                // 指针纵向位置 → 目标行下标
                var listTop = list.getBoundingClientRect().top;
                var toIdx = Math.floor((y - listTop) / h);
                var to = toIdx < 0 ? 0 : (toIdx >= vis.length ? vis.length - 1 : toIdx);
                dragTo = to;

                // 让位：处在 起始位与目标位 之间的行整体平移一个行高
                for (var k = 0; k < vis.length; k++) {
                    if (vis[k] === dragEl) continue;
                    var shift = 0;
                    if (from < to && k > from && k <= to) shift = -h;   // 向下拖：中途行上移让位
                    else if (to < from && k >= to && k < from) shift = h; // 向上拖：中途行下移让位
                    vis[k].style.transform = shift ? 'translateY(' + shift + 'px)' : '';
                }

                // 被拖行跟随目标位置，并额外上移 4px 实现“拖起时轻微抬高”
                var cursorOffset = y - dragY; dragEl.style.transform = 'translateY(' + (cursorOffset - 4) + 'px)';
            }

            /* 拖动结束：真正重排 DOM 顺序、释放位移并保存 */
            function commitDrag(row) {
                var vis = visibleRows();
                var from = -1;
                for (var i = 0; i < vis.length; i++) {
                    if (vis[i] === row) { from = i; break; }
                }
                if (from !== -1) {
                    var to = dragTo;
                    if (to >= 0 && to < vis.length && to !== from) {
                        vis.splice(from, 1);
                        vis.splice(to, 0, row);
                    }
                }
                // 按新顺序重建 DOM（先强制布局再释放 transform，产生平滑归位）
                for (var k = 0; k < vis.length; k++) list.appendChild(vis[k]);
                void list.offsetHeight;
                clearRowShifts();
                endDragSort();
            }

            /* 保存新顺序持久化，同时同步文件夹数组顺序 */
            function endDragSort() {
                var rows = list.children;
                var order = [];
                for (var i = 0; i < rows.length; i++) {
                    var li = rows[i];
                    if (!li._d) continue;
                    if (isFolderRow(li)) {
                        order.push({ t: 'folder', n: li._d.n });
                    } else if (li.style.display !== 'none') {
                        // 只记录可见的普通链接（特殊占位项 display:none 跳过）
                        order.push({ t: 'link', n: li._d.n, u: li._d.u });
                    }
                }
                saveListOrder(order);

                // 根据 DOM 中文件夹出现的先后，同步 folders 数组顺序
                var newFolders = [];
                for (var j = 0; j < rows.length; j++) {
                    var lj = rows[j];
                    if (isFolderRow(lj) && lj._d) {
                        var idx = folderIndexByRef(lj._d);
                        if (idx !== -1) newFolders.push(folders[idx]);
                    }
                }
                // 追加未出现在列表中的文件夹（兜底）
                folders.forEach(function (f) {
                    if (newFolders.indexOf(f) === -1) newFolders.push(f);
                });
                folders = newFolders;
                saveFolders(folders);
            }

            /* ========== 弹窗事件绑定 ========== */
            bindRemoveModal();   // 绑定删除弹窗按钮事件
            bindFolderModal();   // 绑定新建/重命名文件夹弹窗
            bindRenameLinkModal();
            document.getElementById('actionRename').addEventListener('click', actionMenuRename);
            document.getElementById('actionDelete').addEventListener('click', actionMenuDelete);
            document.addEventListener('click', function (e) {
                if (!actionMenu.contains(e.target) && !e.target.closest('.link-dots, .folder-dots')) {
                    closeActionMenu();
                }
            });
            document.getElementById('btn-new-folder').addEventListener('click', openNewFolder);
            document.getElementById('btn-manage').addEventListener('click', toggleManageMode);

            document.getElementById('add-link-btn').addEventListener('click', addNewLink);
            document.getElementById('new-link-name').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') addNewLink();
            });

            /* ========== 加载自定义链接并合并 ========== */
            var savedUL = loadUL();
            savedUL.forEach(function (item) {
                if (!item || !item.url || !item.name) return;
                if (!all.some(function (l) { return l.n === item.name && l.u === item.url; })) {
                    all.push({ n: item.name, u: item.url });
                }
            });

            /* ========== 首次渲染 ========== */
            render();
            cleanLegacyCounts();   // 顺手清理旧版本残留计数数据
        })();
    </script>
</body>

</html>
