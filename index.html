<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lovejiao</title>
    <style>
        /* ===== 全局 CSS 变量（Linear Aesthetic 暗色精密主题） ===== */
        :root{
            --font: "Inter", "Geist Sans", "SF Pro Display", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei UI", sans-serif;
            --canvas: #050506;
            --surface: rgba(255,255,255,0.04);
            --glass-bg: rgba(255,255,255,0.045);
            --glass-border: rgba(255,255,255,0.08);
            --text-primary: #EDEDEF;
            --text-secondary: #8A8F98;
            --accent: #6366F1;
            --accent-glow: #A855F7;
            --accent-weak: rgba(99,102,241,0.18);
        }

        /* 使用 border-box 盒模型，便于布局计算 */
        *{box-sizing:border-box}

        /* 页面主体：近黑底色 + Inter/Geist 字体系列 */
        body{
            margin:0;
            font-family: var(--font);
            background: var(--canvas);
            color: var(--text-primary);
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            padding-bottom: 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 背景视频层 ===== */
        .bg-video{
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            pointer-events: none;
            opacity: 0.45;
        }

        /* 暗色叠加层 + 靛蓝/紫色双色环境光晕（Linear 标志性氛围光） */
        body::before{
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(99,102,241,0.06) 0%, transparent 50%),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(168,85,247,0.04) 0%, transparent 50%),
                var(--canvas);
            pointer-events: none;
            z-index: -2;
        }

        /* ===== 顶部导航（Linear 微边框 + 强毛玻璃） ===== */
        .site-header{
            width:100%;
            background: rgba(8,8,8,0.72);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            margin: 0;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 0;
            box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 8px 32px rgba(0,0,0,0.42);
        }
        .site-header .container{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:1rem;
            padding:0.75rem 1rem;
            max-width:1200px;
            margin:0 auto;
        }

        .brand{
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
            transition: color 150ms ease;
        }
        .brand:hover{ color: var(--accent); }

        .nav-links{
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links .nav-item{ position: relative; }

        .nav-links a:not(.nav-link),
        .nav-links .nav-item > a:not(.nav-link){
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            transition: color 150ms ease, background 150ms ease;
            font-size: 0.93rem;
            display: inline-block;
            letter-spacing: -0.01em;
        }
        .nav-links a:not(.nav-link):hover,
        .nav-links .nav-item > a:not(.nav-link):hover{
            color: var(--text-primary);
            background: rgba(255,255,255,0.06);
        }

        /* ===== 导航链接（Linear 风格：悬停下划线 + 微弱发光） ===== */
        .nav-link {
            position: relative;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 14px;
            transition: color 200ms ease;
            font-weight: 500;
            font-size: 0.93rem;
            display: inline-block;
            cursor: pointer;
            letter-spacing: -0.01em;
        }
        .nav-link:hover {
            color: var(--text-primary);
        }

        /* 底部渐变下划线：靛蓝到紫色 */
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #6366F1 0%, #A855F7 100%);
            border-radius: 1px;
            transition: width 220ms cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 6px rgba(99,102,241,0.45);
        }
        .nav-link:hover::after { width: 70%; }

        /* 当前激活状态 */
        .nav-link.active {
            color: #FFFFFF;
            background: rgba(99,102,241,0.14);
            border-radius: 7px;
            box-shadow: 0 0 16px rgba(99,102,241,0.12);
        }
        .nav-link.active::after { display: none; }

        .nav-links .dropdown-menu{
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            min-width: 120px;
            margin: 0;
            padding: 0.4rem;
            list-style: none;
            background: rgba(18,18,20,0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
            pointer-events: none;
            z-index: 20;
        }
        .nav-links .nav-item:hover .dropdown-menu,
        .nav-links .nav-item:focus-within .dropdown-menu{
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
        .nav-links .dropdown-menu a{
            display: block;
            padding: 0.45rem 0.65rem;
            border-radius: 6px;
            white-space: nowrap;
            color: var(--text-secondary);
            font-size: 0.91rem;
            transition: background 150ms ease, color 150ms ease;
        }
        .nav-links .dropdown-menu a:hover,
        .nav-links .dropdown-menu a:focus{
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
        }

        /* ===== 页面主体布局：左右固定侧栏 + 居中内容 ===== */
        .site-main{ padding: 1.5rem 300px 1.5rem 440px; max-width: none; width: 100%; margin: 0; overflow-x: auto; position: relative; }
        .site-main .layout{
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            position: relative;
        }

        /* 左侧固定栏 */
        .left-column{
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: fixed;
            left: 100px;
            top: 80px;
            width: 400px;
            z-index: 10;
        }

        /* 右侧固定栏 */
        .right-column{
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 260px;
            position: fixed;
            right: 100px;
            top: 80px;
            z-index: 10;
        }

        /* 中间内容栈 */
        .center-stack{
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 550px;
            min-width: 320px;
            position: relative;
            z-index: 10;
            margin: 0 auto;
        }

        /* ===== 个人资料卡片（Linear 微边框 + 微弱环境光） ===== */
        .profile-card{
            width: 100%;
            height: auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-primary);
            flex: 0 0 400px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.35);
            position: relative;
            transition: border-color 220ms ease, box-shadow 220ms ease;
        }
        .profile-card:hover{
            border-color: rgba(255,255,255,0.14);
            box-shadow: 0 0 48px rgba(99,102,241,0.06), 0 8px 32px rgba(0,0,0,0.35);
        }

        /* 个人介绍卡片 */
        .middle-card{
            width: 550px;
            height: 200px;
            min-width: 320px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: left;
            font-family: var(--font);
            font-size: 1.05rem;
            position: relative;
            margin: 0 auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.35);
            transition: border-color 220ms ease;
        }
        .middle-card:hover{
            border-color: rgba(255,255,255,0.14);
        }
        .center-stack{
            display:flex;
            flex-direction:column;
            gap:1.5rem;
            width:550px;
            min-width:320px;
            position:relative;
            z-index:10;
            margin:0 auto;
        }
.photo-wall-card{
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px 24px 28px;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.25);
            position: relative;
            overflow: visible;
        }
        .photo-wall-card::before{
            content: '';
            position: absolute;
            inset: 16px 18px auto;
            height: 70px;
            background: transparent;
            border-radius: 16px;
            pointer-events: none;
        }
        .photo-wall-rope{
            position: absolute;
            top: 30px;
            left: -18px;
            right: -18px;
            height: 160px;
            pointer-events: none;
            z-index: 1;
        }
        .photo-wall-frame{
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 44px;
        }
        .photo-wall-item{
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.55);
            box-shadow: 0 6px 20px rgba(0,0,0,0.22);
            background: #1a1a1e;
            min-height: 120px;
            transform: rotate(-2deg);
            transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
        }
        .photo-wall-item:nth-child(2n){ transform: rotate(2deg); }
        .photo-wall-item:hover{
            transform: rotate(0deg) scale(1.03);
            border-color: rgba(168,133,247,0.45);
            box-shadow: 0 6px 24px rgba(99,102,241,0.14);
        }
        .photo-wall-item img{
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-wall-card::before{
            content:'';
            position:absolute;
            inset:16px 18px auto;
            height:70px;
            background:transparent;
            border-radius:18px;
            pointer-events:none;
        }
        .photo-wall-rope{
            position:absolute;
            top:30px;
            left:-18px;
            right:-18px;
            height:160px;
            pointer-events:none;
            z-index:1;
        }

        .calendar-panel{
            width: 100%;
            height: auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-primary);
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.35);
        }
        .calendar-panel h3{
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .calendar-panel .month-year{
            margin: 0.2rem 0 0;            color: var(--text-secondary);            font-size: 0.9rem;        }
        .calendar-panel .calendar-header{
            display: flex;            justify-content: space-between;            align-items: flex-start;            gap: 1rem;        }
        .calendar-panel .calendar-actions{ display: flex; gap: 0.4rem; }
        .calendar-panel .calendar-actions button{
            width: 34px;
            height: 26px;
            border: none;
            border-radius: 7px;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 150ms ease, color 150ms ease;
        }
        .calendar-panel .calendar-actions button:hover{
            background: rgba(255,255,255,0.12);
            color: var(--text-primary);
        }
        .calendar-panel .calendar-grid{
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
        }
        .calendar-panel .calendar-day-name{
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 6px 0 4px;
        }
        .calendar-panel .calendar-day{
            min-height: 30px;
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 5px;
            color: var(--text-primary);
            position: relative;
            transition: background 150ms ease;
            cursor: pointer;
        }
        .calendar-panel .calendar-day:hover{
            background: rgba(255,255,255,0.1);
        }
        .calendar-panel .calendar-day--today{
            background: rgba(99,102,241,0.18);
            border: 1px solid rgba(99,102,241,0.35);
            box-shadow: 0 0 10px rgba(99,102,241,0.1);
        }
        .calendar-panel .calendar-day--outside{
            color: rgba(237,237,239,0.3);
        }
        .calendar-panel .calendar-day span{
            display: block;
            font-size: 0.74rem;
            font-weight: 600;
            line-height: 1;
        }
        .calendar-panel .calendar-day .schedule-dot{
            width: 5px;
            height: 5px;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }
        .calendar-panel .schedule-dot{
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 6px rgba(99,102,241,0.55);
        }

        /* ===== 响应式布局 ===== */
        @media (max-width:1300px){
            .site-main{ padding: 1.5rem 1rem 1.5rem 1rem; }
            .site-main .layout{ flex-direction: column; align-items: center; }
            .left-column,
            .right-column,
            .middle-card,
            .center-stack{ position: static; width: 90%; }
            .calendar-panel{ width: 100%; height: auto; min-height: 560px; }
            .profile-card{ width: 100%; min-height: 280px; }
        }
        @media (max-width:900px){
            .site-main .layout{ flex-direction: column; align-items: center; }
            .left-column,
            .right-column,
            .middle-card,
            .center-stack{ position: static; width: 92%; }
            .profile-card{ width: 100%; height: auto; min-height: 280px; }
        }

        /* ===== 个人资料卡片细节 ===== */
        .profile-card .avatar{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 2px solid rgba(255,255,255,0.12);
            background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(168,85,247,0.04));
        }
        .profile-card h2{
            margin: 0 0 0.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .profile-card p{
            color: var(--text-secondary);
            line-height: 1.55;
            text-align: center;
            font-size: 0.93rem;
        }

        /* ===== 项目卡片（Linear 微光扫过效果） ===== */
        .project-card{
            width: 100%;
            max-width: 400px;
            height: 100px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
            text-decoration: none;
            box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.35);
            transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        .project-card::before{
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.025) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 500ms ease;
        }
        .project-card:hover::before{ transform: translateX(100%); }
        .project-card:hover{
            transform: translateY(-2px);
            border-color: rgba(99,102,241,0.25);
            box-shadow: 0 0 32px rgba(99,102,241,0.08), 0 8px 32px rgba(0,0,0,0.35);
        }
        .project-card .project-info{
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.5rem;
        }
        .project-card h3{
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .project-card p{
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.55;
            font-size: 0.91rem;
        }
        .project-jt{
            margin: 0;
            font-size: 17px;
        }

        /* ===== 今日日程卡片 ===== */
        .schedule-card{
            width: 100%;
            min-height: 160px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-primary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.35);
        }
        .schedule-card h3{
            margin: 0 0 0.6rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .schedule-card-body{
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            justify-content: center;
            align-items: center;
        }
        .schedule-card-body p{
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.55;
            font-size: 0.91rem;
        }
    </style>
    <!-- 引入共享的图片管理模块（IndexedDB 持久化存储），用于同步 admin.html 中替换的照片 -->
    <script src="photo-manager.js"></script>
</head>

    <script>
        // 页面加载完成后初始化日历和日程逻辑
        document.addEventListener('DOMContentLoaded', function() {
            const monthYearLabel = document.querySelector('.calendar-panel .month-year');
            const calendarDays = document.querySelector('.calendar-days');
            const prevButton = document.querySelector('[data-calendar-prev]');
            const nextButton = document.querySelector('[data-calendar-next]');
            const scheduleBody = document.getElementById('todayScheduleBody');
            const today = new Date();
            let activeYear = today.getFullYear();
            let activeMonth = today.getMonth();

            // 获取指定年月的天数
            function getDaysInMonth(year, month) {
                return new Date(year, month + 1, 0).getDate();
            }

            function formatDateKey(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // 从 localStorage 中读取已保存的日程数据
            function getStoredSchedules() {
                const stored = localStorage.getItem('calendarSchedules');
                if (!stored) return {};
                try {
                    return JSON.parse(stored);
                } catch (error) {
                    return {};
                }
            }

            // 将日程数据保存回 localStorage
            function saveSchedules(schedules) {
                localStorage.setItem('calendarSchedules', JSON.stringify(schedules));
            }

            // 获取今天的日程文本，用于显示今日日程卡片
            function getTodayScheduleText() {
                const schedules = getStoredSchedules();
                const todayKey = formatDateKey(today);
                return schedules[todayKey] || null;
            }

            // 更新右侧“今日日程”卡片显示内容
            function updateTodayScheduleCard() {
                const scheduleText = getTodayScheduleText();
                if (!scheduleText) {
                    scheduleBody.innerHTML = '<p>今天没有任务哦~</p>';
                    return;
                }
                const schedule = JSON.parse(scheduleText);
                scheduleBody.innerHTML = `
                    <p><strong>标题：</strong>${schedule.title}</p>
                    <p><strong>时间：</strong>${schedule.time}</p>
                    <p><strong>内容：</strong>${schedule.content || '无'}</p>
                `;
            }

            // 生成日历网格并渲染到页面
            function renderCalendar(year, month) {
                calendarDays.innerHTML = '';
                monthYearLabel.textContent = `${year}年 ${month + 1}月`;
                const schedules = getStoredSchedules();
                const firstOfMonth = new Date(year, month, 1);
                const startDay = firstOfMonth.getDay();
                const monthDays = getDaysInMonth(year, month);
                const prevMonth = month === 0 ? 11 : month - 1;
                const prevYear = month === 0 ? year - 1 : year;
                const prevMonthDays = getDaysInMonth(prevYear, prevMonth);
                const nextMonth = month === 11 ? 0 : month + 1;
                const nextYear = month === 11 ? year + 1 : year;

                for (let i = 0; i < 42; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'calendar-day';
                    let dayNumber;
                    let cellDate;
                    let isOutside = false;

                    if (i < startDay) {
                        dayNumber = prevMonthDays - startDay + i + 1;
                        isOutside = true;
                        cellDate = new Date(prevYear, prevMonth, dayNumber);
                    } else if (i >= startDay + monthDays) {
                        dayNumber = i - startDay - monthDays + 1;
                        isOutside = true;
                        cellDate = new Date(nextYear, nextMonth, dayNumber);
                    } else {
                        dayNumber = i - startDay + 1;
                        cellDate = new Date(year, month, dayNumber);
                    }

                    if (isOutside) {
                        cell.classList.add('calendar-day--outside');
                    }

                    const span = document.createElement('span');
                    span.textContent = dayNumber;
                    cell.appendChild(span);

                    const cellKey = formatDateKey(cellDate);
                    if (schedules[cellKey]) {
                        const dot = document.createElement('div');
                        dot.className = 'schedule-dot';
                        cell.appendChild(dot);
                    }

                    if (cellDate.toDateString() === today.toDateString()) {
                        cell.classList.add('calendar-day--today');
                        cell.setAttribute('aria-current', 'date');
                    }

                    // 点击日期单元格后，弹出表单录入日程并保存
                    cell.addEventListener('click', function() {
                        const title = prompt('请输入日程标题（必填）');
                        if (!title) {
                            alert('标题为必填项。');
                            return;
                        }
                        const time = prompt('请输入日程时间（必填）');
                        if (!time) {
                            alert('时间为必填项。');
                            return;
                        }
                        const content = prompt('请输入日程内容（可选）') || '';
                        const schedules = getStoredSchedules();
                        schedules[cellKey] = JSON.stringify({ title, time, content });
                        saveSchedules(schedules);
                        renderCalendar(activeYear, activeMonth);
                        updateTodayScheduleCard();
                    });

                    calendarDays.appendChild(cell);
                }
            }

            // 切换日历月份，支持上一月和下一月按钮
            function changeMonth(offset) {
                activeMonth += offset;
                if (activeMonth < 0) {
                    activeMonth = 11;
                    activeYear -= 1;
                } else if (activeMonth > 11) {
                    activeMonth = 0;
                    activeYear += 1;
                }
                renderCalendar(activeYear, activeMonth);
                updateTodayScheduleCard();
            }

            prevButton.addEventListener('click', function() {
                changeMonth(-1);
            });

            nextButton.addEventListener('click', function() {
                changeMonth(1);
            });

            renderCalendar(activeYear, activeMonth);
            updateTodayScheduleCard();
        });

        // ===== 图片同步模块：从 IndexedDB 读取管理员替换的照片 =====
        // 引入 photo-manager.js 后，遍历照片墙，用持久化的图片替换默认图片
        (async function syncPhotosFromAdmin() {
            const photoItems = document.querySelectorAll('.photo-wall-frame .photo-wall-item');
            for (let i = 0; i < photoItems.length; i++) {
                const photoId = 'photo-' + i;   // 与 admin.html 保持一致的 id 规则
                try {
                    const record = await getPhoto(photoId);
                    if (record) {
                        // 存在管理员保存的图片，替换默认图片
                        const imgEl = photoItems[i].querySelector('img');
                        imgEl.src = URL.createObjectURL(record.blob);
                    }
                } catch (err) {
                    console.error('同步图片失败：', photoId, err);
                }
            }
        })();
    </script>
