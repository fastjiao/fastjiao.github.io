<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台</title>
</head>
<body>
    <!-- 导航栏开始：-->
    <nav style="position: fixed; top: 0px; left: 0; width: 100%;height: 70px; display: flex; justify-content: space-between; align-items: center; background-color: #ADEEC5; color: #14B5FF; padding: 10px 0; box-sizing: border-box;">
        <a href="https://www.ljiao.me" style="margin-left: 50px; color: #14B5FF; text-decoration: none;">www.ljiao.me</a>
        <div style="margin-right: 50px; display: flex; gap: 20px;">
            <span>A</span>
            <span>B</span>
            <span>C</span>
        </div>
    </nav>
    <!-- 导航栏结束 -->

    <!-- 左侧导航栏开始：-->
    <aside style="position: fixed; top: 80px; left: 10px; width: 300px; height: calc(100% - 90px); background-color: #2375B2; padding: 20px 0; box-sizing: border-box; border-radius: 10px;">
        <a href="https://www.baidu.com" style="display: block; padding: 10px 20px; margin: 10px; color: #fff; text-decoration: none; background-color: #1B6ACE; border-radius: 6px;">A</a>
        <a href="#" style="display: block; padding: 10px 20px; margin: 10px; color: #fff; text-decoration: none; background-color: #1B6ACE; border-radius: 6px;">B</a>
        <a href="#" style="display: block; padding: 10px 20px; margin: 10px; color: #fff; text-decoration: none; background-color: #1B6ACE; border-radius: 6px;">C</a>
    </aside>
    <!-- 左侧导航栏结束 -->
</body>
</html>
