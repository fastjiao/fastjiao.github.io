<!DOCTYPE html>

    <style>
        /* [主题] Apple Minimalist · 纯白极简
         * 变量与 jiaogt 发布页保持一致，便于全站统一 */
        :root {
            --bg: #ffffff;
            --surface: #f5f5f7;
            --primary: #0071e3;
            --primary-strong: #0058b0;
            --primary-soft: rgba(0, 113, 227, 0.08);
            --text: #1d1d1f;
            --text-muted: #86868b;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 20px 50px -24px rgba(0, 0, 0, 0.14);
            --shadow-sm: 0 8px 24px -12px rgba(0, 0, 0, 0.08);
            
        }

        .project-card-address {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* [背景] 极淡蓝白光晕，几乎纯白但带微妙层次，避免大面积死白 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(1100px 650px at 85% -8%, var(--primary-soft), transparent 55%),
                radial-gradient(800px 500px at -8% 25%, var(--surface), transparent 60%),
                var(--bg);
        }

        /* [布局] 覆盖 shared_nav_light.css 的 .page-content 居中，
         * 改为顶部大留白 + 限宽居中，贴合全宽阅读习惯 */
        .page-content {
            min-height: calc(100vh - 64px);
            display: block;
            max-width: 1120px;
            margin: 0 auto;
            padding: 96px 28px 120px;
        }

        /* [标题区] */
        .projects-head {
            text-align: center;
            margin-bottom: 64px;
        }

        .projects-kicker {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 14px;
        }

        .projects-title {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0 0 16px;
        }

        .projects-sub {
            font-size: 17px;
            color: var(--text-muted);
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* [卡片网格] */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        /* [项目卡片] 浅灰底、squircle 圆角、柔和阴影 */
        .project-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 32px;
            border-radius: 22px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.3s ease,
                        background 0.3s ease;
            will-change: transform;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            background: #ffffff;
        }

        .project-card-name {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* [箭头胶囊] hover 时位移 + 反色，平滑过渡 */
        .project-card-arrow {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--primary);
            background: rgba(0, 113, 227, 0.08);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.3s ease,
                        color 0.3s ease;
        }

        .project-card:hover .project-card-arrow {
            transform: translateX(4px);
            background: var(--primary);
            color: #ffffff;
        }

        /* [入场动画] 滚动触发淡入上移 */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: none;
        }

        /* [响应式] 窄屏单列堆叠 */
        @media (max-width: 640px) {
            .page-content {
                padding: 64px 20px 80px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .project-card {
                padding: 24px;
            }
            .project-card-name {
                font-size: 20px;
            }
        }

        /* [无障碍] 尊重减少动效偏好 */
        @media (prefers-reduced-motion: reduce) {
            .reveal {
                opacity: 1;
                transform: none;
                transition: none;
            }
            .project-card:hover,
            .project-card:hover .project-card-arrow {
                transform: none;
            }
        }
    </style>
</head>

<body>

    <script>
        /* [入场动画] IntersectionObserver 滚动触发；
         * 不支持时直接显示，避免内容空白 */
        (function () {
            var els = document.querySelectorAll(".reveal");
            if ("IntersectionObserver" in window) {
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                            io.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
                els.forEach(function (el) { io.observe(el); });
            } else {
                els.forEach(function (el) { el.classList.add("visible"); });
            }
        })();
    </script>
